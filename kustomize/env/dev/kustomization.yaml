namespace: dev-webapp

resources:
  - ../../base
  
images:
  - name: webapp
    newTag: main

patches:
  - target:
      kind: Deployment
      name: webapp
    path: deploy-patch.yaml

  - target:
      kind: ConfigMap
      name: env-vars
    path: cm-env-vars-patch.yaml

  - target:
      kind: Ingress
      name: webapp
    path: ing-patch.yaml
